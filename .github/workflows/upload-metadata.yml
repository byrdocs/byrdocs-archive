name: Upload metadata

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  BACKUP_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
  BACKUP_ENDPOINT: ${{ secrets.BACKUP_ENDPOINT }}
  BACKUP_ENDPOINT_REGION: ${{ secrets.BACKUP_ENDPOINT_REGION }}
  BACKUP_FILE_BUCKET: ${{ secrets.BACKUP_FILE_BUCKET }}
  BACKUP_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
  BYRDOCS_SITE_URL: ${{ secrets.BYRDOCS_SITE_URL }}
  BYRDOCS_SITE_TOKEN: ${{ secrets.BYRDOCS_SITE_TOKEN }}
  FILELIST_SITE_URL: ${{ secrets.FILELIST_SITE_URL }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_DATA_BUCKET: ${{ secrets.R2_DATA_BUCKET }}
  R2_FILE_BUCKET: ${{ secrets.R2_FILE_BUCKET }}
  SITEMAP_MIN_LASTMOD: ${{ vars.SITEMAP_MIN_LASTMOD }}

permissions:
  contents: read

jobs:
  update:
    if: github.repository == 'byrdocs/byrdocs-archive' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: byrdocs-storage
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pdfium
        name: Get pdfium-binaries latest
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          owner: bblanchon
          repo: pdfium-binaries
      - name: Download release
        run: |
          wget https://github.com/bblanchon/pdfium-binaries/releases/download/${{ steps.pdfium.outputs.release }}/pdfium-linux-x64.tgz
          tar -zxvf pdfium-linux-x64.tgz
          wget https://github.com/byrdocs/byrdocs-check/releases/download/v6.5.2/upload-metadata
          wget https://github.com/byrdocs/byrdocs-check/releases/download/v6.5.2/check-format
          # Digests from the v6.5.2 release assets; update with the pinned version.
          sha256sum --check <<'SHA256'
          ad895d6b98a46c289593091bbbac3cdb05d7d6fbbcc12216b6687a552756749b  check-format
          0e0096938862cbb85b3278823673f34ec70f32e8731ae3d5c1712181602eb332  upload-metadata
          SHA256
          chmod +x upload-metadata check-format
      - name: Check format
        env:
          METADATA_DIR: ./metadata
        run: ./check-format
      - name: Upload metadata
        env:
          METADATA_DIR: ./metadata
        run: ./upload-metadata
      # Confirmation failures belong to BUMP cleanup, not ordinary publication.
      - name: Save publication output for BUMP cleanup
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bump-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            metadata/metadata.json
            metadata/sitemap.xml
          if-no-files-found: error
          retention-days: 90
